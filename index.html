<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISSION : 칼퇴 대작전! Ver2</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- ===================== -->
<!-- 시작화면 -->
<!-- ===================== -->

<main id="startScreen">

    <div class="overlay"></div>

    <div class="startCard">

        <div class="missionLabel">
            🎮 LEVEL 1
        </div>

        <h1>MISSION</h1>

        <h2>칼퇴 대작전!</h2>

        <p>
            오늘 하루,<br>
            당신의 선택이 퇴근을 결정합니다.
        </p>

        <div class="playerForm">

            <label for="playerName">
                이름
            </label>

            <input
                id="playerName"
                type="text"
                maxlength="10"
                autocomplete="off"
                placeholder="이름을 입력하세요">

            <label>
                성별
            </label>

            <div class="genderGroup">

                <button
                    type="button"
                    class="genderBtn"
                    data-gender="male">

                    👨 남성

                </button>

                <button
                    type="button"
                    class="genderBtn"
                    data-gender="female">

                    👩 여성

                </button>

            </div>

            <button
                type="button"
                id="idCardButton"
                class="readyButton">

                ☐ 출근 준비 완료

            </button>

            <button
                type="button"
                id="startButton"
                disabled>

                ▶ 게임 시작

            </button>

        </div>

    </div>

</main>

<!-- ===================== -->
<!-- HUD -->
<!-- ===================== -->

<div id="hud" class="hidden">

    <div class="hudItem">

        🕘
        <span id="gameTime">
            09:00
        </span>

    </div>

    <div class="hudItem">

        ⭐
        <span id="score">
            0
        </span>점

    </div>

    <div class="hudItem">

        ❤️
        <span id="trust">
            100
        </span>%

    </div>

    <div class="hudItem">

        📋
        <span id="progress">
            0
        </span>%

    </div>

</div>

<!-- ===================== -->
<!-- 게임 출력 영역 -->
<!-- ===================== -->

<div id="gameContainer"></div>

<!-- ===================== -->
<!-- 출근증 -->
<!-- ===================== -->

<div id="idCardModal" class="hidden">

    <div class="idCard">

        <div class="idTitle">

            🎉 출근 준비 완료

        </div>

        <div
            class="idName"
            id="cardName">

            홍길동

        </div>

        <div class="idJob">

            신입사원

        </div>

        <div class="idReady">

            오늘도 화이팅!

        </div>

    </div>

</div>
<!-- ===================== -->
<!-- 결과창 -->
<!-- ===================== -->

<div id="resultModal" class="hidden">

    <div class="resultCard">

        <div id="resultIcon">

            ✅

        </div>

        <!-- 최종 엔딩에서만 표시 -->
        <div
            id="resultStars"
            class="hidden">

            ⭐⭐⭐⭐⭐

        </div>

        <h2 id="resultTitle">

            좋은 선택!

        </h2>

        <p id="resultText">

            결과 내용

        </p>

        <button
            type="button"
            id="nextMissionButton">

            다음 미션 ▶

        </button>

        <button
            type="button"
            id="restartButton"
            class="hidden">

            🔄 처음으로

        </button>

    </div>

</div>

<!-- ===================== -->
<!-- JavaScript -->
<!-- ===================== -->

<script src="js/missions.js"></script>
<script src="js/ending.js"></script>

<script type="module" src="js/app.js"></script>

</body>
</html>
