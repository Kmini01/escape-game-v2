<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MISSION : 칼퇴 대작전! Ver2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ===================================================== -->
<!-- Loading -->
<!-- ===================================================== -->

<div id="loadingScreen">

    <div class="loadingBox">

        <div class="spinner"></div>

        <h2>MISSION LOADING...</h2>

        <p>출근 준비중입니다.</p>

    </div>

</div>

<!-- ===================================================== -->
<!-- Effect -->
<!-- ===================================================== -->

<div id="effectLayer"></div>

<div id="confettiLayer"></div>

<!-- ===================================================== -->
<!-- Start -->
<!-- ===================================================== -->

<main id="startScreen">

    <div class="overlay"></div>

    <section class="startCard">

        <div class="levelBadge">

            🎮 LEVEL 1

        </div>

        <h1>

            MISSION

        </h1>

        <h2>

            칼퇴 대작전!

        </h2>

        <p>

            오늘 하루,<br>
            당신의 선택이<br>
            퇴근 시간을 결정합니다.

        </p>

        <div class="playerForm">

            <label>

                이름

            </label>

            <input
                id="playerName"
                maxlength="10"
                autocomplete="off"
                placeholder="이름 입력">

            <label>

                성별

            </label>

            <div class="genderGroup">

                <button
                    class="genderBtn"
                    data-gender="male"
                    type="button">

                    👨 남성

                </button>

                <button
                    class="genderBtn"
                    data-gender="female"
                    type="button">

                    👩 여성

                </button>

            </div>

            <button
                id="idCardButton"
                class="readyButton"
                type="button">

                📋 출근 준비 완료

            </button>

            <button
                id="startButton"
                type="button">

                ▶ 게임 시작

            </button>

        </div>

    </section>

</main>

<!-- ===================================================== -->
<!-- HUD -->
<!-- ===================================================== -->

<header id="hud" class="hidden">

    <div class="hudItem">

        🕘

        <span id="gameTime">

            09:00

        </span>

    </div>

    <div class="hudItem">

        ⭐

        <span id="score">

            0

        </span>

        점

    </div>

    <div class="hudItem">

        ❤️

        <span id="trust">

            100

        </span>

        %

    </div>

    <div class="hudItem">

        📋

        <span id="progress">

            0

        </span>

        %

    </div>

    <div class="hudItem">

        🎯

        <span id="missionNumber">

            Mission 1

        </span>

    </div>

</header>

<!-- ===================================================== -->
<!-- Time Bar -->
<!-- ===================================================== -->

<div id="timeBar">

    <div id="timeFill"></div>

</div>

<!-- ===================================================== -->
<!-- Main -->
<!-- ===================================================== -->

<main id="gameContainer">

    <section id="missionArea">

        <div class="missionHeader">

            <div id="missionBadge">

                TODAY MISSION

            </div>

            <h2 id="missionTitle">

                미션 제목

            </h2>

            <p id="missionDescription">

                미션 설명이 표시됩니다.

            </p>

        </div>

        <div id="characterArea">

            <img
                id="characterImage"
                src="assets/characters/default.png"
                alt="캐릭터">

        </div>

        <div id="dialogArea">

            <div class="speaker">

                👤 상대방

            </div>

            <div
                class="dialogText"
                id="dialogText">

                대사가 표시됩니다.

            </div>

        </div>
